!
upgrade fpd auto
version 15.3
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Chennai
!
enable secret 5 $1$rEQo$xEQ8Y.qpIAJ4MQq/kiBop1
!
no aaa new-model
no ip icmp rate-limit unreachable
no ip domain lookup
ip domain name tbnetworks
ip cef
no ipv6 cef
!
username admin password 0 admin123
!
interface GigabitEthernet1/0
 ip address 192.168.12.2 255.255.255.0
 negotiation auto
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 10
 login local
 transport input ssh
 transport output ssh
!
end
