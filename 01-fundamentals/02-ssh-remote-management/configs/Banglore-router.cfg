!
upgrade fpd auto
version 15.3
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Banglore
!
enable secret 5 $1$WtO5$bCntBnG8lfg5j8EVK2vIG0
!
no aaa new-model
no ip icmp rate-limit unreachable
no ip domain lookup
ip domain name thnetworks
ip cef
no ipv6 cef
!
username admin password 0 admin123
!
interface GigabitEthernet1/0
 ip address 192.168.12.1 255.255.255.0
 negotiation auto
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login local
 transport input ssh
 transport output ssh
!
end
