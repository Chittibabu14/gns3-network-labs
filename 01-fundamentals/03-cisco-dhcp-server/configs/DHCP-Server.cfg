!
! Lab 03: Cisco IOS Router as DHCP Server (DHCP-Server)
! Maintained by Chittibabu Bavisetti (@Chittibabu14)
!
version 15.3
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname DHCP-Server
!
no ip domain lookup
ip cef
no ipv6 cef
!
! Define DHCP Excluded IP Address Range (192.168.1.100 - 192.168.1.110)
ip dhcp excluded-address 192.168.1.100 192.168.1.110
!
! Define DHCP Address Pool for LAN Clients
ip dhcp pool SBI-BANK
 network 192.168.1.0 255.255.255.0
 default-router 192.168.1.100
 dns-server 8.8.8.8 8.8.4.4
!
interface FastEthernet0/0
 no ip address
 shutdown
!
interface GigabitEthernet1/0
 description Connected to Switch1 LAN (192.168.1.0/24)
 ip address 192.168.1.100 255.255.255.0
 negotiation auto
 no shutdown
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
 transport input all
!
end
