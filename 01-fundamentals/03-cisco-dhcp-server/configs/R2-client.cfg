!
! Lab 03: Cisco IOS Router as DHCP Client (R2)
! Maintained by Chittibabu Bavisetti (@Chittibabu14)
!
version 15.3
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R2
!
no ip domain lookup
ip cef
no ipv6 cef
!
interface FastEthernet0/0
 no ip address
 shutdown
!
interface GigabitEthernet1/0
 description Connected to Switch1 LAN (Obtains IP via DHCP)
 ip address dhcp
 negotiation auto
 no shutdown
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
 transport input all
!
end
